<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 绢底 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F2EAD8"/>
  <!-- 墨梅老枝 -->
  <g fill="none" stroke="#2B2620" stroke-linecap="round">
    <path d="M9 54 C20 49 27 42 32 34 C36 28 41 23 47 19" stroke-width="4.4"/>
    <path d="M26 41 C31 42.5 37 45 42 45" stroke-width="3.2"/>
    <path d="M40 24 C42 20 43 17 42.5 13" stroke-width="2.8"/>
  </g>
  <!-- 朱砂梅一朵（盛放） -->
  <g fill="#A63E2E">
    <circle cx="45.6" cy="10.4" r="2.2"/>
    <circle cx="48.2" cy="12.8" r="2.2"/>
    <circle cx="47.2" cy="16" r="2.2"/>
    <circle cx="44" cy="16" r="2.2"/>
    <circle cx="43" cy="12.8" r="2.2"/>
  </g>
  <circle cx="45.6" cy="13.2" r="1.1" fill="#2B2620"/>
  <!-- 朱砂蓓蕾一粒 -->
  <circle cx="44.2" cy="44" r="1.5" fill="#A63E2E"/>
  <!-- 淡墨梅一朵（剪影） -->
  <g fill="#6B6154">
    <circle cx="30" cy="29.4" r="2.1"/>
    <circle cx="32.4" cy="31.6" r="2.1"/>
    <circle cx="31.5" cy="34.6" r="2.1"/>
    <circle cx="28.5" cy="34.6" r="2.1"/>
    <circle cx="27.6" cy="31.6" r="2.1"/>
  </g>
  <circle cx="30" cy="32.2" r="1.1" fill="#F2EAD8"/>
  <!-- 落印 -->
  <rect x="49.5" y="49.5" width="6.6" height="6.6" rx="1" fill="#A63E2E"/>
  <rect x="51.3" y="51.3" width="3" height="3" rx="0.6" fill="#F2EAD8"/>
</svg>
