  <!-- 素月 -->
  <circle cx="43.5" cy="16" r="7.8" fill="#FDFAF1"/>
  <!-- 远岫淡墨 -->
  <path filter="url(#ssSoft)" fill="#8E99A6" opacity=".42"
        d="M2 40 C10 30 17 27.5 25 33 C33 38.5 40 25.5 49 29.5 C53.5 31.5 58 33.5 62 36 L62 64 L2 64 Z"/>
  <!-- 近坡浓墨 -->
  <path fill="#3F4852" opacity=".9"
        d="M2 55 C9 44.5 17 40.5 26 45.5 C33 49.5 40 43 48 46 C53.5 48 58.5 51.5 62 56 L62 64 L2 64 Z"/>
  <!-- 朱砂小印，藏者之记 -->
