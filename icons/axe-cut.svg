<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 松烟墨底 -->
  <rect width="64" height="64" fill="#223430"/>
  <!-- 远嶂（沉入夜色） -->
  <polygon points="34,64 36,40 48,16 64,28 64,64" fill="#354A42"/>
  <!-- 片石三片，以壁为纸；第三片削出画外，峭峰不见其顶 -->
  <polygon points="6,64 12,40 24,44 20,64" fill="#E9E2CC"/>
  <polygon points="26,64 34,30 48,36 42,64" fill="#E9E2CC"/>
  <polygon points="52,64 58,22 72,28 70,64" fill="#E9E2CC"/>
  <!-- 明暗分明：每片右侧面一笔暗皴 -->
  <polygon points="12,40 24,44 21,54" fill="#C6BC9F"/>
  <polygon points="34,30 48,36 44,47" fill="#C6BC9F"/>
  <polygon points="58,22 72,28 68,40" fill="#C6BC9F"/>
  <!-- 水口一线，瀑布垂下 -->
  <rect x="49.2" y="31" width="1.9" height="26" fill="#223430"/>
  <!-- 素月一点，压住左上虚白 -->
  <circle cx="14" cy="13.5" r="5.5" fill="#E9E2CC"/>
</svg>
