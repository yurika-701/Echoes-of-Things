<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sealCe" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0503F"/>
      <stop offset=".55" stop-color="#9E3D33"/>
      <stop offset="1" stop-color="#8A332B"/>
    </linearGradient>
  </defs>
  <!-- 印地：朱砂 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sealCe)"/>
  <!-- 简牍四片，长短各异（岁有其物，物有其容） -->
  <g fill="#F9F4E7">
    <rect x="16"   y="17.5" width="5.5" height="29" rx="2.75"/>
    <rect x="24.5" y="14"   width="5.5" height="36" rx="2.75"/>
    <rect x="33"   y="19"   width="5.5" height="28" rx="2.75"/>
    <rect x="41.5" y="15.5" width="5.5" height="33" rx="2.75"/>
  </g>
  <!-- 韦绳两道，缠简而过（以印地色切开，如刻痕） -->
  <g stroke="url(#sealCe)" stroke-width="2.3" stroke-linecap="round" fill="none">
    <path d="M11.5 24.5 H52.5"/>
    <path d="M11.5 39.5 H52.5"/>
  </g>
</svg>
