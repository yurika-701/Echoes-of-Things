<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sealMoon" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0503F"/>
      <stop offset=".55" stop-color="#9E3D33"/>
      <stop offset="1" stop-color="#8A332B"/>
    </linearGradient>
  </defs>
  <!-- 印地：朱砂 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sealMoon)"/>
  <!-- 飞鸟 -->
  <path d="M22.5 15.5 Q25 13.1 27.5 15.5" fill="none" stroke="#F9F4E7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M29.5 12.5 Q32 10.1 34.5 12.5" fill="none" stroke="#F9F4E7" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 月（自山脊后升起） -->
  <circle cx="40" cy="25" r="10.5" fill="#F9F4E7"/>
  <!-- 远峰 -->
  <path d="M8.5 31 L16 21.5 L23 29.5" fill="none" stroke="#F9F4E7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 主山（压过月之下缘） -->
  <path d="M4 55 L22 25 L33 33 L46 27 L54 31 L60 50 L60 55 Z" fill="#F9F4E7"/>
  <!-- 山脊刻缝：以印地色切开月与山 -->
  <path d="M4 55 L22 25 L33 33 L46 27 L54 31 L60 50" fill="none" stroke="url(#sealMoon)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
