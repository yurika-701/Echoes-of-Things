<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wgNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A5876"/>
      <stop offset=".52" stop-color="#5A7A92"/>
      <stop offset=".8" stop-color="#A7B4AC"/>
      <stop offset="1" stop-color="#DAC49C"/>
    </linearGradient>
    <radialGradient id="wgMoon" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FDF9EC"/>
      <stop offset="1" stop-color="#F0E4BC"/>
    </radialGradient>
    <filter id="wgMist"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="64" height="64" fill="url(#wgNight)"/>

  <!-- 满月与清辉 -->
  <circle cx="44" cy="20" r="24" fill="#F7EFDA" opacity=".07"/>
  <circle cx="44" cy="20" r="19" fill="#F7EFDA" opacity=".11"/>
  <circle cx="44" cy="20" r="13" fill="url(#wgMoon)"/>

  <!-- 早星两点 -->
  <circle cx="8"  cy="8"  r=".9"  fill="#F2EBD6" opacity=".6"/>
  <circle cx="15" cy="16" r=".75" fill="#F2EBD6" opacity=".45"/>

  <!-- 天际余光一抹 -->
  <ellipse cx="18" cy="51" rx="28" ry="4.5" fill="#EDD9AC" opacity=".28" filter="url(#wgMist)"/>

  <!-- 雁阵成字，掠月而行 -->
  <g stroke="#1C2733" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path transform="translate(16 22) scale(1.25)"   d="M-3.4 .9 Q-1.3 -1.3 0 .3 Q1.3 -1.3 3.4 .9"/>
    <path transform="translate(25 25.5) scale(1.05)" d="M-3.4 .9 Q-1.3 -1.3 0 .3 Q1.3 -1.3 3.4 .9"/>
    <path transform="translate(36 28) scale(.92)"    d="M-3.4 .9 Q-1.3 -1.3 0 .3 Q1.3 -1.3 3.4 .9"/>
    <path transform="translate(44 31) scale(.78)"    d="M-3.4 .9 Q-1.3 -1.3 0 .3 Q1.3 -1.3 3.4 .9"/>
    <path transform="translate(51.5 34.5) scale(.62)" d="M-3.4 .9 Q-1.3 -1.3 0 .3 Q1.3 -1.3 3.4 .9"/>
  </g>

  <!-- 西楼一角，檐角高挑 -->
  <g fill="#18232E">
    <path d="M0 64 L0 53.5 C7 52.6 13.4 50.4 18 46.6 C20 44.9 21.6 42.7 22.6 40.2 L25.2 41.4 C24 44.6 22.1 47.4 19.5 49.8 C15.2 53.8 8.6 56.6 0 57.6 Z"/>
    <path d="M0 61.4 C7.6 60.4 14.6 57.4 19.5 53.4 L19.5 49.8 C15.2 53.8 8.6 56.6 0 57.6 Z"/>
    <circle cx="23.9" cy="40.8" r="1.2"/>
  </g>
</svg>
