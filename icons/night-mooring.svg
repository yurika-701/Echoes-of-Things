<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1F29"/>
      <stop offset=".66" stop-color="#20404A"/>
    </linearGradient>
    <linearGradient id="nmWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3540"/>
      <stop offset="1" stop-color="#08141B"/>
    </linearGradient>
    <radialGradient id="nmMoon" cx=".42" cy=".38" r=".8">
      <stop offset="0" stop-color="#FCF4DC"/>
      <stop offset="1" stop-color="#EBDCAC"/>
    </radialGradient>
    <filter id="nmInk" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="nmMist"><feGaussianBlur stdDeviation=".8"/></filter>
  </defs>

  <rect width="64" height="42" fill="url(#nmSky)"/>
  <rect y="42" width="64" height="22" fill="url(#nmWater)"/>

  <!-- 月与晕 -->
  <circle cx="45" cy="15" r="17" fill="#F5ECD0" opacity=".05"/>
  <circle cx="45" cy="15" r="12" fill="#F5ECD0" opacity=".09"/>
  <circle cx="45" cy="15" r="8" fill="url(#nmMoon)"/>

  <!-- 远山入暮 -->
  <path d="M0 42 L0 30 C6 24 12 22 19 26 C25 29 31 27 37 24 L37 42 Z"
        fill="#14262D" opacity=".92" filter="url(#nmMist)"/>

  <!-- 泊岸与枯枝，墨韵毛边 -->
  <g filter="url(#nmInk)">
    <path d="M0 30 C7 30 13 34 18 39 C22 43 26 45.5 30 46.5 L30 64 L0 64 Z" fill="#061119"/>
    <path d="M13 33 C18 29.5 21 26 22 21.5" stroke="#061119" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M20 25 C21.5 24 22.3 23 23.2 22.6" stroke="#061119" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 月光照水 -->
  <ellipse cx="44" cy="50" rx="9.5" ry="2" fill="#23404B" opacity=".8"/>
  <g fill="#2E4A54">
    <rect x="10" y="50" width="9" height="1.2" rx=".6" opacity=".7"/>
    <rect x="20" y="55" width="7" height="1.1" rx=".55" opacity=".5"/>
    <rect x="50" y="57" width="8" height="1.1" rx=".55" opacity=".45"/>
    <rect x="33" y="59" width="6" height="1"  rx=".5"  opacity=".4"/>
  </g>

  <!-- 孤舟泛月，一人独坐 -->
  <g>
    <ellipse cx="37.5" cy="50" rx="8" ry="1.7" fill="#26454F" opacity=".65"/>
    <path d="M30 46.5 C33.5 44.8 41.5 44.8 45 46.5 C43 49.3 40 50.4 37.5 50.4 C35 50.4 32 49.3 30 46.5 Z" fill="#050D13"/>
    <path d="M34 46.6 Q36.5 43.4 39 46.6 Z" fill="#050D13"/>
    <circle cx="43.6" cy="43.4" r="1.05" fill="#050D13"/>
    <rect x="43" y="44.3" width="1.3" height="2.2" rx=".6" fill="#050D13"/>
    <path d="M43.9 44.6 L47.2 41.8" stroke="#050D13" stroke-width=".8" stroke-linecap="round"/>
    <path d="M47.2 41.8 L47.6 45.6" stroke="#C9BC8F" stroke-width=".4" opacity=".9"/>
  </g>

  <!-- 碎金月影 -->
  <g fill="#D9C893">
    <rect x="44.5" y="44.5" width="6" height="1.2" rx=".6" opacity=".8"/>
    <rect x="47"   y="47.5" width="4" height="1.1" rx=".55" opacity=".55"/>
    <rect x="45.5" y="50.5" width="5" height="1"   rx=".5"  opacity=".4"/>
    <rect x="48"   y="53.5" width="3" height="1"   rx=".5"  opacity=".28"/>
  </g>
</svg>
