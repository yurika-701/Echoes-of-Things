  <rect x="30.1" y="13" width="2.8" height="34" fill="#1B2531"/>
  <rect x="37.1" y="13" width="2.8" height="34" fill="#1B2531"/>
  <rect x="44.1" y="13" width="2.8" height="34" fill="#1B2531"/>
  <!-- 角上落款小印 -->
  <rect x="41" y="41" width="5" height="5" fill="#A63B2E"/>
