<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ssSilk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2E6"/>
      <stop offset="1" stop-color="#EAE2CF"/>
    </linearGradient>
    <filter id="ssSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>
  <!-- 绢底 -->
