<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 物色集 · 墨竹印：绢底册页，两竿直竹，撇叶如刀，直角朱印 -->
  <rect x="0" y="0" width="64" height="64" fill="#F1E9D6"/>
  <!-- 竹竿两竿：竹节以断口示意 -->
  <g stroke="#2B2620" stroke-linecap="butt">
    <path d="M24 7 V18.5" stroke-width="4.4"/>
    <path d="M24 20.5 V30.5" stroke-width="4.4"/>
    <path d="M24 32.5 V42.5" stroke-width="4.4"/>
    <path d="M24 44.5 V57" stroke-width="4.4"/>
    <path d="M41 16 V28.5" stroke-width="2.8"/>
    <path d="M41 30.5 V40.5" stroke-width="2.8"/>
    <path d="M41 42.5 V57" stroke-width="2.8"/>
  </g>
  <!-- 小枝 -->
  <path d="M24 12 L33 9" stroke="#2B2620" stroke-width="1.5" stroke-linecap="butt"/>
  <!-- 竹叶：撇叶锋锐 -->
  <path d="M24 12 Q31 12.5 35.5 18.5 Q28 16.5 24 14.5 Z" fill="#6B6154"/>
  <path d="M24 12 Q17.5 13.5 13.5 19.5 Q19.5 17 24 14.5 Z" fill="#26221C"/>
  <path d="M33 9 Q39.5 8.5 43.5 12.5 Q37 12.2 33 10.8 Z" fill="#6B6154"/>
  <path d="M41 20 Q47 20.5 51 25.5 Q44.5 24.5 41 22.5 Z" fill="#26221C"/>
  <path d="M41 20 Q36 21.5 33.5 26 Q37.5 24.5 41 22.5 Z" fill="#6B6154"/>
  <!-- 落印 -->
  <rect x="50" y="50" width="7" height="7" fill="#A63E2E"/>
  <rect x="51.9" y="51.9" width="3.2" height="3.2" fill="#F1E9D6"/>
</svg>
